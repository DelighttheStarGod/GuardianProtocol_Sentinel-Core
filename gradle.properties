# Gradle 自身的内存与网络设置。
# 反编译 Minecraft 很吃内存，4G 是实测够用的值。
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# 容忍慢速 / 不稳定链路。
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000


## 构建环境属性

# 目标 Minecraft 版本，必须与 Forge 版本匹配
minecraft_version=1.20.1
# 允许的 Minecraft 版本范围
minecraft_version_range=[1.20.1,1.21)
# Forge 版本
forge_version=47.4.23
forge_version_range=[47,)
loader_version_range=[47,)
# 映射通道：official = Mojang 官方名（开发环境用，发布 jar 时自动重混淆）
mapping_channel=official
mapping_version=1.20.1


## Mod 标识（★ modId 一旦发布就不要再改）

# modId 必须全小写，正则 [a-z][a-z0-9_]{1,63}，这是 Forge 资源命名空间的硬性要求。
# 它是配置目录名与资源命名空间，改动会让已有存档与配置失联。
mod_id=guardian_protocol
# 游戏内显示名
mod_name=Guardian Protocol: Sentinel Core
# 构建产物文件名前缀：<mod_archive_name>-<mod_version>[-all].jar
mod_archive_name=GuardianProtocol_Sentinel-Core
# 版本口径：项目尚未正式发版，所有改动都算 0.1.0；破坏性改动也不抬版本。
mod_version=0.1.0
mod_license=MIT
# 基础包名，必须与 src/main/java 下的目录结构一致
mod_group_id=com.guardianprotocol
# 作者
mod_authors=guardian-protocol
# 描述：mod 列表里显示的简介。
# ★ 这里只能放 ASCII！gradle.properties 在 Gradle(JVM) 侧的加载编码不受我们控制，
#   UTF-8 的中文会被按单字节解码成乱码，而 processResources 在用 Groovy 模板
#   展开 mods.toml 时，乱码会让模板脚本语法解析直接失败。
#   中文简介请写进 assets/guardian_protocol/lang/*.json（那里是 UTF-8，可靠）。
mod_description=Guardian Protocol: Sentinel Core - a 1-4 player co-op auto tower-defense + auto-battler hybrid for Minecraft, adapted from an original sandbox co-op design. Characters are rendered as 2D pixel sprites (billboard quads). Deploy before the wave, then the battle runs itself.
