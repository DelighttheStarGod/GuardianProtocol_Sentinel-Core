// 卫戍协议 · Sentinel Core —— Gradle 工程配置
// 只声明工程名与插件仓库；构建逻辑全在 build.gradle。
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'GuardianProtocol_Sentinel-Core'
